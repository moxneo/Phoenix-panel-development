---
name: Build and publish crafting-apps image

"on":
  push:
    branches:
      - main
    paths:
      - "eggs/crafting-apps/**"
      - ".github/workflows/crafting-apps-image.yml"
  pull_request:
    paths:
      - "eggs/crafting-apps/**"
      - ".github/workflows/crafting-apps-image.yml"
  workflow_dispatch:

# Least privilege by default. Only the publish job (never run for
# pull_request events) gets packages: write.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/moxneo/crafting-apps

jobs:
  build-pr:
    # Pull requests: build only, no registry login, no package token.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: eggs/crafting-apps
          file: eggs/crafting-apps/Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    # push to main / manual dispatch. Pushes only from refs/heads/main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA tag
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish flags
        id: publish
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: eggs/crafting-apps
          file: eggs/crafting-apps/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ steps.publish.outputs.source }}
